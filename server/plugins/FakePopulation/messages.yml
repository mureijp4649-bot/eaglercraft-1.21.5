prefix: "&8[&#A855F7FakePopulation&8] "

no-permission: "{prefix}&cYou do not have permission to use this."
players-only: "{prefix}&cOnly a player can use this command."
unknown-command: "{prefix}&cUnknown subcommand. Use &f/fp help&c."
invalid-name: "{prefix}&cNames and skin names must be 3-16 letters, numbers or underscores."
invalid-number: "{prefix}&cEnter a valid number."
add-failed: "{prefix}&cCould not add &f{fake}&c. The name may already be used or the safety limit was reached."
added: "{prefix}&aAdded &f{fake} &7using skin name &f{skin}&7."
added-random: "{prefix}&aAdded &f{amount} &arandom fake player(s)."
removed: "{prefix}&cRemoved &f{fake}&c."
removed-all: "{prefix}&cRemoved &f{amount} &cfake player(s)."
not-found: "{prefix}&cFake player &f{fake} &cwas not found."
list-empty: "{prefix}&7There are no active fake players."
list-header: "{prefix}&7Active fake players: &f{amount}"
list-entry: "&8- &f{fake} &8| &7skin: &f{skin} &8| &7ping: &f{ping}ms &8| &7{type}"
usage-add: "{prefix}&7Usage: &f/fp add <name> [skinName]"
usage-remove: "{prefix}&7Usage: &f/fp remove <name>"
usage-setlocation: "{prefix}&7Usage: &f/fp setlocation <id>"
usage-dellocation: "{prefix}&7Usage: &f/fp dellocation <id>"
usage-teleport: "{prefix}&7Usage: &f/fp teleport <fakeName>"
location-saved: "{prefix}&aSaved NPC location &f{location}&a."
location-deleted: "{prefix}&cDeleted NPC location &f{location}&c."
location-not-found: "{prefix}&cNPC location &f{location} &cwas not found."
location-failed: "{prefix}&cCould not save that location."
locations: "{prefix}&7NPC locations: &f{locations}"
teleported: "{prefix}&aTeleported NPC &f{fake}&a."
npc-not-found: "{prefix}&cNo active physical NPC was found for &f{fake}&c."
enabled: "{prefix}&aFakePopulation enabled."
disabled: "{prefix}&cFakePopulation disabled and all fake players removed."
reloaded: "{prefix}&aConfiguration, messages, names and locations reloaded."
tab-refreshed: "{prefix}&aResent all fake TAB entries."
debug-header: "&#A855F7&lFakePopulation Debug"
debug-line: "&8- &7{key}: &f{value}"

fake-join: "&e{fake} joined the game"
fake-quit: "&e{fake} left the game"

# Legacy reply lists. They are still used if chat.human-like.enabled is false.
chat-responses:
  greetings:
    - "hey {player}"
    - "yo"
    - "welcome {player}"
    - "hi"
  help:
    - "try /help"
    - "check spawn, most things are explained there"
    - "not sure tbh"
  server:
    - "the server is pretty chill"
    - "im at spawn rn"
    - "check the shop menu"

periodic-chat:
  - "anyone wanna trade?"
  - "does anyone need wood?"
  - "where are you guys building?"
  - "just found diamonds lol"
  - "spawn looks nice"
  - "anyone doing pvp?"
  - "brb getting food"

# Natural local chat pools for 1.2.0.
# Placeholders: {player}, {fake}, {randomfake}, {online}
human-chat:
  responses:
    greetings:
      - "yo {player}"
      - "hey"
      - "sup"
      - "yoo"
      - "hey {player}"
      - "whats up"
      - "hi lol"
      - "welcome"
    help:
      - "try /help"
      - "check spawn i think its explained there"
      - "not sure tbh"
      - "i think theres a menu for that"
      - "maybe ask staff"
      - "check /help maybe"
      - "i forgot lol"
    server:
      - "servers been pretty chill today"
      - "im at spawn rn"
      - "check the shop menu"
      - "i only joined a bit ago lol"
      - "spawn should have most of the stuff"
      - "yeah i think so"
    trade:
      - "what do u need"
      - "how much are you buying"
      - "i might have some"
      - "depends what youre paying lol"
      - "check ah maybe"
      - "i sold mine already rip"
      - "how much per"
      - "i can check my chests"
    pvp:
      - "where"
      - "im down in a min"
      - "nah im keeping my stuff lol"
      - "who are u fighting"
      - "give me a sec"
      - "pvp at spawn?"
      - "what gear"
    question:
      - "idk tbh"
      - "probably"
      - "i think so"
      - "not sure"
      - "maybe lol"
      - "yeah pretty sure"
      - "ask staff maybe"
      - "i havent tried it"
    generic:
      - "lol"
      - "fr"
      - "same"
      - "nice"
      - "rip"
      - "wait what"
      - "no way"
      - "fair"
      - "lmao"
      - "gg"

  periodic:
    - "anyone selling iron?"
    - "where are u guys building"
    - "just found diamonds lol"
    - "anyone doing pvp"
    - "brb getting food"
    - "what are people grinding rn"
    - "is ah dead today"
    - "finally got enough xp"
    - "who keeps buying all the wood lol"
    - "anyone need cobble"
    - "im so lost rn"
    - "how long have u guys been on"
    - "gg"
    - "spawn looks different"
    - "anyone got spare food"
    - "what should i grind next"
    - "my inventory is full again bruh"
    - "who wants this random iron"

  # Each entry is: first fake message || second fake reply
  # {fake} = speaker, {other} = the other fake player.
  conversations:
    - "anyone selling iron? || i got some how much u need"
    - "where is everyone rn || im at spawn"
    - "anyone wanna pvp || with what gear lol"
    - "is the shop worth using || for some stuff yeah"
    - "i just died bruh || rip what did u lose"
    - "who bought all the logs || wasnt me lol"
    - "anyone got food || yeah come spawn"
    - "how long u been playing here || couple days i think"
    - "this grind takes forever || fr"
    - "gg || gg"
    - "u at spawn {other}? || yeah one sec"
    - "anyone need cobble || nah i got way too much already"

help:
  - "&#A855F7&lFakePopulation Commands"
  - "&f/fp &8- &7Open the admin GUI"
  - "&f/fp add <name> [skin] &8- &7Add a fake player"
  - "&f/fp addrandom [amount] &8- &7Add random fake players"
  - "&f/fp remove <name> &8- &7Remove one fake player"
  - "&f/fp removeall &8- &7Remove every fake player"
  - "&f/fp list &8- &7List active fake players"
  - "&f/fp setlocation <id> &8- &7Save an NPC location"
  - "&f/fp dellocation <id> &8- &7Delete an NPC location"
  - "&f/fp locations &8- &7List NPC locations"
  - "&f/fp teleport <name> &8- &7Move a physical NPC to you"
  - "&f/fp enable|disable &8- &7Toggle the system"
  - "&f/fp refresh &8- &7Resend TAB entries"
  - "&f/fp reload &8- &7Reload files"
  - "&f/fp debug &8- &7Show compatibility status"
