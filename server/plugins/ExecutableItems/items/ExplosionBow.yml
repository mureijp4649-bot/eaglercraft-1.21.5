  cancel-item-craft-no-custom: true
  # The item can't be used
  # to craft any item
  # (Even custom items)
  cancel-item-craft: true
  # The item can't be
  # to deposit in a chest
  cancel-deposit-in-chest: true
  # The item can't be
  # to deposit in a furnace
  cancel-deposit-in-furnace: true
  # The item can't be
  # enchanted
  cancel-enchant: true
  # The item can't be
  # placed in an anvil
  cancel-anvil: true
  # The item can't be
  # renamed in an anvil
  cancel-rename-anvil: true
  # The item can't be
  # enchanted in an anvil
  cancel-enchant-anvil: true
  # The item can't be
  # placed on an armorstand
  cancel-armorstand: true
  # The item can't be
  # placed in a grind stone
  cancel-grind-stone: true
  # The item can't be
  # placed in an item frame
  cancel-item-frame: true
  # The item can't be
  # placed in a beacon
  cancel-beacon: true
  # The item can't be
  # placed in a dispenser
  cancel-dispenser: true
  # The item can't be
  # placed in a dropper
  cancel-dropper: true
  # The item can't be
  # placed in a hopper
  cancel-hopper: true
  # The item can't be
  # placed in a decorated pot
  cancel-decorated-pot: true
  # The item can't be
  # placed in a crafter
  cancel-crafter: true
  # The item can't be
  # placed in a bundle
  cancel-place-in-bundle: true
  # The item can't be
  # placed in a merchant
  cancel-merchant: true
  # The item can't be
  # placed in a horse
  cancel-horse: true
  # The item can't be
  # burned
  cancel-item-burn: true
  # The item can't be
  # deleted by cactus
  cancel-item-delete-by-cactus: true
  # The item can't be
  # deleted by lightning
  cancel-item-delete-by-lightning: true
  # The item can't be
  # moved of the inventory
  locked-in-inventory: false
