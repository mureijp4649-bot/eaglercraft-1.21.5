  sound: ITEM_SPEAR_ATTACK
  # Enable the sound played when an entity is hit
  enableHitSound: false
  # The hit sound
  # Requires Paperspigot or its forks to work
  hitSound: ITEM_SPEAR_HIT
# Charge/lunge attack based on speed (1.21.11+)
kineticWeaponFeatures:
  # Enable this features
  enable: false
  # Cooldown in ticks between two contacts
  contactCooldownTicks: 20
  # Delay in ticks before the kinetic effect starts
  delayTicks: 0
  forwardMovement: 1.0
  damageMultiplier: 1.0
  # Max duration (ticks) the dismount condition stays active
  dismountMaxDurationTicks: 20
  dismountMinSpeed: 0.0
  dismountMinRelativeSpeed: 0.0
  # Max duration (ticks) the knockback condition stays active
  knockbackMaxDurationTicks: 20
  knockbackMinSpeed: 0.0
  knockbackMinRelativeSpeed: 0.0
  # Max duration (ticks) the damage condition stays active
  damageMaxDurationTicks: 20
  damageMinSpeed: 0.0
  damageMinRelativeSpeed: 0.0
  # Enable the sound
  enableSound: false
  # The sound
  sound: ITEM_SPEAR_LUNGE_1
  # Enable the sound played when an entity is hit
  enableHitSound: false
  # The hit sound
  # Requires Paperspigot or its forks to work
  hitSound: ITEM_SPEAR_HIT
