# The attack range of the weapon (1.21.11+)
attackRangeFeatures:
  # Enable this features
  enable: false
  minReach: 0.0
  maxReach: 3.0
  minCreativeReach: 0.0
  maxCreativeReach: 6.0
  hitboxMargin: 1.0
  mobFactor: 2.0
# The weapon pierces through entities (1.21.11+)
piercingWeaponFeatures:
  # Enable this features
  enable: false
  # Whether the piercing attack deals knockback
  dealsKnockback: true
  # Whether the attack dismounts hit entities
  dismounts: false
