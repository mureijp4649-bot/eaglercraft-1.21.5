# =========================================================
# ORBITAL STRIKE - TRAILS CONFIGURATION
# =========================================================
# System supports creating multiple particle layers per cannon.
# - particle: The name of the particle (E.g.: FLAME, LAVA, ELECTRIC_SPARK).
#   * Supports DUST coloring: DUST:<R>,<G>,<B>:<Size> (E.g.: DUST:255,0,0:1.5)
# - formula-x, formula-y, formula-z: Spawn coordinates evaluated via Math expressions.
#   * 't' is the variable representing Time (Ticks). Each tick 't' increments by 1.
#   * Supported functions: sin(t), cos(t), tan(t), sqrt(t), abs(t), +, -, *, /, %
#   * 0.5 is the exact center of the TNT block.
# - spread: The spread potential of the particle in XYZ format. E.g.: "0.2, 0.2, 0.2"
# - speed: The movement speed of the particle.
# - count: The amount of particles spawned per tick.
# =========================================================

stab_example:
  enabled: true
  layers:
  - particle: FLAME
    formula-x: '0'
    formula-y: '0.5'
    formula-z: '0'
    spread: 0.2, 0.2, 0.2
    speed: 0.1
    count: 5

nuke_example:
  layers:
  - particle: DUST:255,255,0:2.0
    formula-x: 1.5 * cos(t * 0.4)
    formula-y: '0.5'
    formula-z: 1.5 * sin(t * 0.4)
    spread: 0, 0, 0
    speed: 0
    count: 1
  - particle: DUST:255,100,0:1.5
    formula-x: 1.0 * cos((t * 0.4) + 3.14)
    formula-y: '0.5'
    formula-z: 1.0 * sin((t * 0.4) + 3.14)
    spread: 0, 0, 0
    speed: 0
    count: 1

recursion_example:
  layers:
  - particle: SOUL_FIRE_FLAME
    formula-x: 0.8 * cos(t * 0.5)
    formula-y: '0.5'
    formula-z: 0.8 * sin(t * 0.5)
    spread: 0, 0, 0
    speed: 0
    count: 2
  - particle: SOUL
    formula-x: '0'
    formula-y: t * 0.05
    formula-z: '0'
    spread: 0.2, 0.2, 0.2
    speed: 0.02
    count: 1

emp_example:
  layers:
  - particle: ELECTRIC_SPARK
    formula-x: '0'
    formula-y: '0.5'
    formula-z: '0'
    spread: 0.4, 0.4, 0.4
    speed: 0.2
    count: 15
  - particle: FIREWORKS_SPARK
    formula-x: 1.2 * sin(t * 0.3)
    formula-y: 0.5 + sin(t * 0.2)
    formula-z: 1.2 * cos(t * 0.3)
    spread: 0, 0, 0
    speed: 0
    count: 2
nuke:
  layers:
  - formula-x: '0'
    formula-y: '0.5'
    formula-z: '0'
    count: 3
    particle: FLAME
    speed: 0.05
    spread: 0.1, 0.1, 0.1
stab:
  layers:
  - formula-x: '0'
    formula-y: '0.5'
    formula-z: '0'
    count: 3
    particle: FLAME
    speed: 0.05
    spread: 0.1, 0.1, 0.1
