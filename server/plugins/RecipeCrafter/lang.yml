# Language Configuration for Recipe Crafter
# Supports Kyori MiniMessage formatting

prefix: "<gray>[<gradient:aqua:blue>Recipe Crafter</gradient>]</gray> "

messages:
  no_permission: "<red><b>Error!</b> <gray>You do not have permission to use this command."
  only_players: "<red><b>Error!</b> <gray>Only players can use this command."
  recipes_disabled: "<red><b>Error!</b> <gray>Custom recipes are currently disabled."
  recipe_not_found: "<red><b>Error!</b> <gray>Recipe <yellow>{name}</yellow> not found."
  recipe_already_exists: "<red><b>Error!</b> <gray>Recipe <yellow>{name}</yellow> already exists!"
  recipe_created: "<green><b>Success!</b> <gray>Recipe <yellow>{name}</yellow> has been saved."
  recipe_deleted: "<green><b>Success!</b> <gray>Recipe <yellow>{name}</yellow> has been deleted."
  recipe_renamed: "<green><b>Success!</b> <gray>Renamed recipe <yellow>{old}</yellow> to <yellow>{new}</yellow>."
  recipe_toggled_on: "<green><b>Success!</b> <gray>Recipe <yellow>{name}</yellow> enabled."
  recipe_toggled_off: "<red><b>Success!</b> <gray>Recipe <yellow>{name}</yellow> disabled."
  craft_limit_reached: "<red>Crafting limit reached for this item!"
  craft_disabled: "<red>This recipe is currently disabled!"
  global_craft_disabled: "<red>Custom crafting is currently disabled!"
  shift_click_disabled: "<red>Shift-clicking is disabled for custom recipes requiring >1 item per slot."
  reloaded: "<green><b>Success!</b> <gray>Configuration and language files reloaded."
  usage: "<red><b>Usage:</b> <gray>{usage}"
